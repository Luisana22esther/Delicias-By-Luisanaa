<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Delicias By Luisana — Pedidos</title>
<style>
:root{
  --wine:#790807; --wine2:#9b1111; --cream:#fff8e9; --paper:#fffdf8;
  --ink:#351b18; --muted:#806d67; --line:#eadbd0; --green:#287a52; --gold:#b68a35;
}
*{box-sizing:border-box}
body{margin:0;background:#f7efe6;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:linear-gradient(135deg,#680606,#930d0d);color:#fff;padding:18px 16px 22px;position:sticky;top:0;z-index:5;box-shadow:0 4px 18px #4b00002a}
.logo{display:block;width:180px;height:70px;object-fit:contain;margin:0 auto 8px;border-radius:8px}
.header-row{display:flex;justify-content:space-between;align-items:center;gap:12px}
h1{font-family:Georgia,serif;font-size:22px;margin:0}
.sub{opacity:.8;font-size:12px}
main{max-width:900px;margin:auto;padding:16px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 4px 12px #6b2d1a0b}
.stat b{display:block;font-size:22px;margin-top:3px}.stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.tab{border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px 7px;text-align:center;font-weight:700;color:var(--wine);cursor:pointer}
.tab.active{background:var(--wine);color:#fff}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:15px}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.panel h2{font-family:Georgia,serif;font-size:21px;margin:0}
.price{color:var(--muted);font-size:13px;margin-top:3px}
button{border:0;border-radius:12px;padding:10px 13px;font-weight:700;cursor:pointer}
.primary{background:var(--wine);color:#fff}.secondary{background:#f1e5db;color:var(--ink)}
.search{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;margin:4px 0 12px;font-size:15px;background:white}
.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:13px;margin:9px 0}
.card-top{display:flex;justify-content:space-between;gap:8px}.name{font-weight:800}.total{font-weight:800;color:var(--wine)}
.meta{font-size:13px;color:var(--muted);line-height:1.55;margin:7px 0}
.badge{display:inline-block;border-radius:99px;padding:4px 8px;font-size:11px;font-weight:800;margin:2px 3px 2px 0}
.paid{background:#e4f4eb;color:var(--green)}.unpaid{background:#fff0cf;color:#875d00}
.delivered{background:#e7edf8;color:#31578c}.pending{background:#f8e1df;color:#8a2b24}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.actions button{font-size:12px;padding:8px 10px}
.empty{text-align:center;color:var(--muted);padding:35px 10px}
.modal{position:fixed;inset:0;background:#21000077;display:none;align-items:flex-end;justify-content:center;z-index:20}
.modal.show{display:flex}.sheet{background:var(--paper);width:100%;max-width:600px;border-radius:22px 22px 0 0;padding:18px;max-height:92vh;overflow:auto}
.sheet h2{font-family:Georgia,serif;margin:0 0 12px}
label{display:block;font-size:12px;font-weight:700;margin:10px 0 5px;color:var(--muted)}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:11px;background:white;font-size:15px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.form-actions{display:flex;gap:9px;margin-top:15px}.form-actions button{flex:1}
.production-row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.production-row:last-child{border-bottom:0}
.production-name{font-weight:650;font-size:14px}.production-qty{font-weight:850;color:var(--wine);font-size:17px}
.production-boxes{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:13px}
.production-box{background:#f8eee5;border-radius:12px;padding:9px;text-align:center}
.production-box b{display:block;font-size:18px;color:var(--wine)}.production-box span{font-size:10px;color:var(--muted);text-transform:uppercase}
.footer{text-align:center;color:var(--muted);font-size:11px;padding:25px}
@media(min-width:700px){.stats{grid-template-columns:repeat(4,1fr)}.modal{align-items:center}.sheet{border-radius:22px}.logo{width:220px}}
</style>
</head>

};

let box=1, orders=JSON.parse(localStorage.getItem('delicias_orders')||'[]'), editing=null;
const money=n=>new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(n);
function save(){localStorage.setItem('delicias_orders',JSON.stringify(orders));}
function setBox(n){
  box=Number(n);
  document.querySelectorAll('.tab').forEach((x,i)=>x.classList.toggle('active',i===box-1));
  document.getElementById('boxTitle').textContent='BOX '+box;
  document.getElementById('boxPrice').textContent=money(prices[box])+' por box';
  document.getElementById('search').value='';
  render();
}
function render(){
 const q=document.getElementById('search').value.toLowerCase();
 const arr=orders.filter(o=>o.box===box && (o.name.toLowerCase().includes(q)||o.phone.toLowerCase().includes(q)));
 document.getElementById('list').innerHTML=arr.length?arr.map(o=>`<div class="card">
  <div class="card-top"><div class="name">${esc(o.name)}</div><div class="total">${money(o.total)}</div></div>
  <div class="meta">📞 ${esc(o.phone||'Sin teléfono')} · ${o.qty} box${o.qty>1?'es':''}<br>📅 ${esc(o.date||'Sin fecha')}${o.notes?'<br>📝 '+esc(o.notes):''}</div>
  <span class="badge ${o.paid?'paid':'unpaid'}">${o.paid?'✓ PAGADO':'PAGO PENDIENTE'}</span>
  <span class="badge ${o.delivered?'delivered':'pending'}">${o.delivered?'✓ ENTREGADO':'ENTREGA PENDIENTE'}</span>
  <div class="actions">
   <button class="secondary" onclick="togglePaid(${o.id})">${o.paid?'Marcar pendiente':'Marcar pagado'}</button>
   <button class="secondary" onclick="toggleDelivered(${o.id})">${o.delivered?'Marcar no entregado':'Marcar entregado'}</button>
   <button class="secondary" onclick="editOrder(${o.id})">Editar</button>
   <button class="secondary" onclick="deleteOrder(${o.id})">Eliminar</button>
  </div></div>`).join(''):'<div class="empty">Todavía no hay pedidos para este box.<br>Usá “+ Agregar” para cargar el primero.</div>';

 const totalBoxes=orders.reduce((s,o)=>s+o.qty,0), sales=orders.reduce((s,o)=>s+o.total,0);
 document.getElementById('sBoxes').textContent=totalBoxes;
 document.getElementById('sOrders').textContent=orders.length;
 document.getElementById('sSales').textContent=money(sales);
 document.getElementById('sPending').textContent=orders.filter(o=>!o.delivered).length;
 renderProduction();
}

function renderProduction(){
  const totals={};
  [1,2,3].forEach(n=>{
    const qty=orders.filter(o=>o.box===n).reduce((s,o)=>s+o.qty,0);
    Object.entries(composition[n]).forEach(([product,perBox])=>{
      totals[product]=(totals[product]||0)+(qty*perBox);
    });
  });

  const boxCounts=[1,2,3].map(n=>orders.filter(o=>o.box===n).reduce((s,o)=>s+o.qty,0));
  const rows=Object.entries(totals).filter(([,qty])=>qty>0)
    .sort(([a],[b])=>a.localeCompare(b,'es'))
    .map(([product,qty])=>`<div class="production-row"><div class="production-name">${esc(product)}</div><div class="production-qty">${qty}</div></div>`).join('');

  document.getElementById('production').innerHTML=`
    <div class="production-boxes">
      <div class="production-box"><span>Box 1</span><b>${boxCounts[0]}</b></div>
      <div class="production-box"><span>Box 2</span><b>${boxCounts[1]}</b></div>
      <div class="production-box"><span>Box 3</span><b>${boxCounts[2]}</b></div>
    </div>
    ${rows || '<div class="empty" style="padding:20px 5px">Cuando cargues pedidos, acá aparecerá automáticamente todo lo que tenés que preparar.</div>'}
  `;
}

function openForm(id=null){
 editing=id;document.getElementById('modal').classList.add('show');document.getElementById('formTitle').textContent=id?'Editar pedido':'Nuevo pedido';
 if(id){let o=orders.find(x=>x.id===id);document.getElementById('fName').value=o.name;document.getElementById('fPhone').value=o.phone;document.getElementById('fQty').value=o.qty;document.getElementById('fDate').value=o.date;document.getElementById('fPaid').value=o.paid?'si':'no';document.getElementById('fDelivered').value=o.delivered?'si':'no';document.getElementById('fNotes').value=o.notes||'';}
 else {['fName','fPhone','fDate','fNotes'].forEach(x=>document.getElementById(x).value='');document.getElementById('fQty').value=1;document.getElementById('fPaid').value='no';document.getElementById('fDelivered').value='no';}
}
function closeForm(){document.getElementById('modal').classList.remove('show');editing=null}
function saveOrder(){
 const name=document.getElementById('fName').value.trim(); if(!name){alert('Ingresá el nombre del cliente.');return}
 const qty=Math.max(1,parseInt(document.getElementById('fQty').value)||1);
 const data={box,name,phone:document.getElementById('fPhone').value.trim(),qty,date:document.getElementById('fDate').value.trim(),paid:document.getElementById('fPaid').value==='si',delivered:document.getElementById('fDelivered').value==='si',notes:document.getElementById('fNotes').value.trim(),total:(prices[box]||0)*qty};
 if(editing){const i=orders.findIndex(o=>o.id===editing);orders[i]={...orders[i],...data};}else orders.push({id:Date.now(),...data});
 save();closeForm();render();
}
function editOrder(id){openForm(id)}
function deleteOrder(id){if(confirm('¿Eliminar este pedido?')){orders=orders.filter(o=>o.id!==id);save();render();}}
function togglePaid(id){let o=orders.find(x=>x.id===id);o.paid=!o.paid;save();render()}
function toggleDelivered(id){let o=orders.find(x=>x.id===id);o.delivered=!o.delivered;save();render()}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
setBox(1);
</script>
</body>
</html>
